[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maaqc"
version = "0.1.0.dev0"
description = "MAA Quantum Characterization — pipeline CREST -> CENSO -> OPT -> NumFreq -> SP -> TDDFT -> ADC2 para caracterización cuántica de MAAs (PAPER1, Marine Drugs)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Kmilo", email = "TODO@example.com" },
]
keywords = [
    "computational-chemistry",
    "orca",
    "crest",
    "censo",
    "tddft",
    "adc2",
    "mycosporine-like-amino-acids",
    "quantum-chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Dependencias reales, extraídas de los imports de pipeline.py /
# results_collector.py / protonation_cycle.py / recover_prescreening.py.
# matplotlib se importa de forma perezosa (try/except) en el código
# original para no romper corridas headless sin GUI/backend — se mantiene
# como dependencia dura igual porque analysis/plots.py la necesita para
# cualquier uso real; si se quiere replicar el fallback opcional, mover a
# un extra "plots".
dependencies = [
    "numpy",
    "pandas",
    "ase",
    "pyyaml",
    "pydantic>=2",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/kmilozeta/maaqc"
Repository = "https://github.com/kmilozeta/maaqc"

# Único entry point vía console_scripts, estilo CREST/CENSO — reemplaza
# la invocación "python pipeline.py ..." por subcomandos "maaqc <subcomando>".
[project.scripts]
maaqc = "maaqc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maaqc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
