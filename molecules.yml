# molecules.yml — λmax experimental por molécula/estado
#
# Asocia el nombre de la carpeta de corrida (= stem del .xyz de entrada,
# p.ej. "A" para molecules/A.xyz → runs/A/) con el λmax experimental en nm.
#
# El pipeline consulta este archivo al terminar ADC2 para calcular:
#   Δλ = λ_ADC2 − λ_exp
# y lo reporta en el log y en runs/<mol>/07_adc2/adc2_results.json.
#
# Reglas:
#   • Las claves deben coincidir exactamente con mol_xyz.stem (case-sensitive).
#   • Comentarios con # al final de la línea son válidos.
#   • Si una clave no está aquí, el pipeline usa EXP_LAMBDA_FALLBACK
#     (definido en pipeline.py) como segundo nivel de fallback.
#   • Para agregar una molécula nueva:
#       echo "  MiMol: 320.0" >> molecules.yml

exp_lambda:

  # ── M-Gly:Val (Mycosporine-Glycine:Valine) ─────────────────────────────
  # λmax experimental: ~335 nm  (UV-Vis en H2O, organismos antárticos)
  # Ref: Shick & Dunlap 2002; Wada et al. 2015; dato propio pendiente pub.
  A:   335.0   # estado A — carboxilato libre (pKa ~3.5)
  B:   335.0   # estado B — amino protonado   (pKa ~8.2)
  C:   335.0   # estado C — dianión
  D:   335.0   # estado D — zwitterion (puente de sal intramolecular)
  R:   335.0   # estado R — neutro tautómero

  # ── Shinorine ──────────────────────────────────────────────────────────
  # λmax experimental: ~334 nm  (UV-Vis en H2O)
  # Ref: Nakamura et al. 1982; Conde et al. 2000
  SA:  334.0   # estado A
  SB:  334.0   # estado B
  SC:  334.0   # estado C
  SD:  334.0   # estado D
  SR:  334.0   # estado R (neutro)

  # ── Porphyra-334 ───────────────────────────────────────────────────────
  # λmax experimental: ~334 nm
  # Ref: Carreto et al. 1990
  # PA:  334.0
  # PR:  334.0

  # ── Plantilla para molécula nueva ──────────────────────────────────────
  # NombreCarpeta: 000.0   # descripción, referencia
